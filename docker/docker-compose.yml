version: '3.8'

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui_ia
    ports:
      - "3080:8080"
    environment:
      - OLLAMA_BASE_URL=http://YOUR_LOCAL_IP:11434 
      - WEBUI_SECRET_KEY=YOUR_SECRET_KEY
    volumes:
      - open-webui_data:/app/backend/data
    restart: unless-stopped

volumes:
  open-webui_data: